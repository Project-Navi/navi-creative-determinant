[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "creative-determinant"
version = "0.1.0"
description = "A field theory of coherence and meaning: nonlinear elliptic PDEs for presence emergence"
readme = "README.md"
license = {file = "LICENSE.md"}
authors = [
    {name = "Nelson Spence", email = "nelson@projectnavi.ai"}
]
maintainers = [
    {name = "Nelson Spence", email = "nelson@projectnavi.ai"}
]
keywords = [
    "coherence",
    "viability",
    "elliptic-pde",
    "enactivism",
    "semiotics",
    "ai-safety",
    "cognitive-science",
    "dynamical-systems"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
]

[project.optional-dependencies]
# Kept minimal for pip users who can't run uv. The authoritative dev
# environment lives in [dependency-groups].dev below — CI uses that.
docs = [
    "zensical>=0.0.24",
]

[project.urls]
Homepage = "https://projectnavi.ai"
Documentation = "https://github.com/Project-Navi/navi-creative-determinant"
Repository = "https://github.com/Project-Navi/navi-creative-determinant"
Issues = "https://github.com/Project-Navi/navi-creative-determinant/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]  # Line length handled separately

[dependency-groups]
# uv sync --locked installs this group by default. CI workflows use it as
# the single source of truth so no `pip install` is needed (Scorecard flags
# unpinned pip commands). Only tools actually invoked by CI or contributors
# belong here; drop anything that stops being used.
dev = [
    # test / coverage
    "pytest>=9.0.3",
    "coverage>=7.0.0",
    # lint / format / type check
    "ruff>=0.15.4",
    "mypy>=1.11",
    # security scanners
    "bandit>=1.8",
    "pip-audit>=2.7",
    # notebooks
    "jupyter>=1.0.0",
    "nbconvert>=7.17.1",
    "ipykernel>=6.29",
    "nbqa>=1.9",
    # commit hygiene
    "pre-commit>=3.8.0",
]
docs = [
    "zensical>=0.0.24",
]
