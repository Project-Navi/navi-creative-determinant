# Paper build check
#
# Rebuilds paper/creative_determinant.pdf from source with bibliography and
# cross-references, fails on unresolved references or citations, and checks
# that the committed PDF's text agrees with the freshly built one, so that the
# TeX source and the checked-in PDF cannot drift apart silently. The rebuilt
# PDF is uploaded as an artifact; the committed file is never modified here.

name: Paper

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'paper/**'
      - '.github/workflows/paper.yml'
  pull_request:
    branches: [main]
    paths:
      - 'paper/**'
      - '.github/workflows/paper.yml'
  workflow_dispatch:

jobs:
  build-paper:
    name: Build paper from source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install TeX Live and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-bibtex-extra latexmk poppler-utils

      - name: Build in a clean directory
        run: |
          mkdir -p build
          cp paper/creative_determinant.tex paper/cd_refs.bib build/
          cd build
          latexmk -pdf -interaction=nonstopmode -halt-on-error creative_determinant.tex
          if grep -E "Reference .* undefined|Citation .* undefined|multiply defined" creative_determinant.log; then
            echo "::error::unresolved references or citations"
            exit 1
          fi
          pages=$(pdfinfo creative_determinant.pdf | awk '/^Pages:/ {print $2}')
          echo "pages: $pages"
          test "$pages" -ge 10

      - name: Compare committed PDF text with the rebuilt PDF
        run: |
          pdftotext -layout paper/creative_determinant.pdf committed.txt
          pdftotext -layout build/creative_determinant.pdf rebuilt.txt
          python3 - <<'EOF'
          import difflib, re
          def norm(path):
              text = open(path, encoding="utf-8", errors="replace").read()
              return [re.sub(r"\s+", " ", line).strip() for line in text.splitlines() if line.strip()]
          a, b = norm("committed.txt"), norm("rebuilt.txt")
          ratio = difflib.SequenceMatcher(None, a, b).ratio()
          print(f"text similarity committed vs rebuilt: {ratio:.4f} ({len(a)} vs {len(b)} lines)")
          if ratio < 0.97:
              print("::error::the committed PDF does not match the source; rebuild and commit paper/creative_determinant.pdf")
              raise SystemExit(1)
          EOF

      - name: Upload rebuilt PDF
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rebuilt-paper
          path: build/creative_determinant.pdf
          retention-days: 14
