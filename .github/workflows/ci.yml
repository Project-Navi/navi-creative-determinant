# CI — Creative Determinant
#
# Holds four of the six org-required checks; job keys ARE the check names.
# CONTRACT (this file): lint, typecheck, security, quality-gate
# Other required checks live in codeql.yml ('codeql') and semgrep.yml ('semgrep').
# The 'test' aggregator job below is NOT in the required list, but is preserved
# as a fail-fast signal for the test-run matrix.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # ── required checks (lint / typecheck / security / quality-gate) and 'test' aggregator ─

  test-run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          submodules: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
      - name: Install dependencies (from uv.lock)
        run: uv sync --locked
      - name: Run tests
        run: uv run pytest tests/ -v --tb=long --junit-xml=results/test-results-${{ matrix.python-version }}.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: results/
          retention-days: 30

  # NOTE: 'test' is NOT in the org ruleset's required-checks list — runs on
  # every PR as a fail-fast aggregator over the test-run matrix, but the
  # ruleset doesn't gate on it. Keep the job key 'test' anyway so any future
  # decision to require it is a one-line ruleset edit.
  test:
    needs: test-run
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check matrix results
        run: |
          if [ "${{ needs.test-run.result }}" != "success" ]; then
            echo "::error::Test matrix failed"
            exit 1
          fi

  # CONTRACT: org ruleset requires this exact check name 'lint'
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
      - name: Install dependencies (from uv.lock)
        run: uv sync --locked
      - name: Ruff check + format
        run: |
          uv run ruff check src/ tests/ --output-format=github
          uv run ruff format src/ tests/ --check

  # CONTRACT: org ruleset requires this exact check name 'typecheck'
  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
      - name: Install dependencies (from uv.lock)
        run: uv sync --locked
      - name: Run mypy
        run: uv run mypy src/cd --ignore-missing-imports --no-error-summary || true

  # CONTRACT: org ruleset requires this exact check name 'security'
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
      - name: Install dependencies (from uv.lock)
        run: uv sync --locked
      - name: Bandit
        run: uv run bandit -r src/ -ll || true
      - name: pip-audit
        run: uv run pip-audit || true

  # CONTRACT: org ruleset requires this exact check name 'quality-gate'
  quality-gate:
    needs: [test, lint, typecheck, security]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Evaluate gate
        run: |
          echo "test:      ${{ needs.test.result }}"
          echo "lint:      ${{ needs.lint.result }}"
          echo "typecheck: ${{ needs.typecheck.result }}"
          echo "security:  ${{ needs.security.result }}"
          for result in \
            "${{ needs.test.result }}" \
            "${{ needs.lint.result }}" \
            "${{ needs.typecheck.result }}" \
            "${{ needs.security.result }}"; do
            if [ "$result" != "success" ]; then
              echo "::error::Required check failed: $result"
              exit 1
            fi
          done
          echo "All gates passed"

  # ── non-required domain checks ─────────────────────────────

  numerical-stability:
    runs-on: ubuntu-latest
    needs: test-run
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
      - name: Install dependencies (from uv.lock)
        run: uv sync --locked
      - name: Run numerical stability tests
        run: |
          uv run python -c "
          import sys
          sys.path.insert(0, 'src')
          from cd import solve_1d_picard, principal_eigenvalue_1d
          from cd.eigenvalues import viability_threshold_1d
          import numpy as np

          print('Testing numerical stability across grid resolutions...')
          print()

          L, b, c, p = 1.0, 0.8, 10.0, 2.0
          beta_star = viability_threshold_1d(L, b)
          beta = 1.2 * beta_star

          results = []
          for N in [50, 100, 200, 400, 800, 1600]:
              x, Phi, info = solve_1d_picard(L, N, a=0.0, beta_b=beta*b, c=c, p=p)
              lam = principal_eigenvalue_1d(N, L, beta*b)
              results.append((N, info['maxPhi'], lam, info['iters']))
              print(f'  N={N:4d}: max\u03a6={info[\"maxPhi\"]:.6f}, \u03bb\u2081={lam:.6f}, iters={info[\"iters\"]}')

          print()
          print('Convergence analysis:')
          for i in range(1, len(results)):
              N_prev, phi_prev, _, _ = results[i-1]
              N_curr, phi_curr, _, _ = results[i]
              if abs(phi_prev) > 1e-10:
                  ratio = abs(phi_curr - phi_prev) / abs(results[-1][1] - phi_prev) if abs(results[-1][1] - phi_prev) > 1e-10 else 0
                  print(f'  N={N_prev}\u2192{N_curr}: \u0394(max\u03a6)={abs(phi_curr-phi_prev):.2e}')

          final_values = [r[1] for r in results[-3:]]
          spread = max(final_values) - min(final_values)
          print()
          print(f'Solution spread (last 3 grids): {spread:.2e}')

          if spread > 0.01:
              print('WARNING: Solution not converged!')
              sys.exit(1)
          else:
              print('Numerical stability verified')
          "

  eigenvalue-precision:
    runs-on: ubuntu-latest
    needs: test-run
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
      - name: Install dependencies (from uv.lock)
        run: uv sync --locked
      - name: Verify eigenvalue precision
        run: |
          uv run python -c "
          import sys
          sys.path.insert(0, 'src')
          from cd import principal_eigenvalue_1d
          import numpy as np

          print('Verifying eigenvalue formula')
          print()

          L = 1.0
          b = 0.8

          max_error = 0
          for N in [100, 200, 400, 800, 1600]:
              print(f'Grid N={N}:')
              for beta in [5.0, 10.0, 15.0, 20.0]:
                  lam_numeric = principal_eigenvalue_1d(N, L, beta * b)
                  lam_analytic = (np.pi / L)**2 - beta * b
                  rel_error = abs(lam_numeric - lam_analytic) / abs(lam_analytic)
                  max_error = max(max_error, rel_error)
                  status = 'OK' if rel_error < 0.001 else 'FAIL'
                  print(f'  beta={beta:5.1f}: numeric={lam_numeric:10.6f}, analytic={lam_analytic:10.6f}, error={rel_error:.2e} {status}')
              print()

          print(f'Maximum relative error: {max_error:.2e}')

          if max_error > 0.001:
              print('ERROR: Eigenvalue precision below threshold!')
              sys.exit(1)
          else:
              print('Eigenvalue precision verified (error < 0.1%)')
          "

  threshold-verification:
    runs-on: ubuntu-latest
    needs: test-run
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
      - name: Install dependencies (from uv.lock)
        run: uv sync --locked
      - name: Verify bifurcation threshold
        run: |
          uv run python -c "
          import sys
          sys.path.insert(0, 'src')
          from cd import solve_1d_picard, principal_eigenvalue_1d
          from cd.eigenvalues import viability_threshold_1d
          import numpy as np

          L, N, b, c, p = 1.0, 400, 0.8, 10.0, 2.0
          beta_star = viability_threshold_1d(L, b)

          print(f'Viability threshold: beta* = {beta_star:.6f}')
          print()

          trivial_count = 0
          nontrivial_count = 0

          for ratio in np.linspace(0.5, 1.5, 21):
              beta = ratio * beta_star
              lam = principal_eigenvalue_1d(N, L, beta * b)
              _, _, info = solve_1d_picard(L, N, a=0.0, beta_b=beta*b, c=c, p=p)
              sol_type = 'TRIVIAL' if info['maxPhi'] < 1e-6 else 'NONTRIVIAL'
              if info['maxPhi'] < 1e-6:
                  trivial_count += 1
              else:
                  nontrivial_count += 1
              print(f'  {ratio:5.2f} | {lam:8.4f} | {info[\"maxPhi\"]:8.6f} | {sol_type}')

          print()
          print(f'Trivial solutions: {trivial_count}')
          print(f'Nontrivial solutions: {nontrivial_count}')

          if trivial_count < 5 or nontrivial_count < 5:
              print('ERROR: Bifurcation not detected correctly!')
              sys.exit(1)
          else:
              print('Bifurcation threshold verified')
          "

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
      - name: Install dependencies (from uv.lock)
        run: uv sync --locked
      - name: Run tests with coverage
        run: |
          uv run coverage run -m pytest tests/ -v
          uv run coverage report --show-missing
          uv run coverage xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30
