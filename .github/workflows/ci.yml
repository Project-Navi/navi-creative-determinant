# CI — Creative Determinant
#
# Holds four of the five checks the org ruleset requires on main; job keys ARE the check names.
# CONTRACT (this file): lint, typecheck, security, quality-gate
# The fifth required check is 'semgrep' (semgrep.yml); 'codeql' (codeql.yml) runs on every PR
# but is not in the required list.
# The 'test' aggregator job below is NOT in the required list, but is preserved
# as a fail-fast signal for the test-run matrix.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # ── required checks (lint / typecheck / security / quality-gate) and 'test' aggregator ─

  test-run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
      - name: Install dependencies (from uv.lock)
        run: uv sync --locked
      - name: Run tests
        run: uv run pytest tests/ -v --tb=long --junit-xml=results/test-results-${{ matrix.python-version }}.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: results/
          retention-days: 30

  # NOTE: 'test' is NOT in the org ruleset's required-checks list — runs on
  # every PR as a fail-fast aggregator over the test-run matrix, but the
  # ruleset doesn't gate on it. Keep the job key 'test' anyway so any future
  # decision to require it is a one-line ruleset edit.
  test:
    needs: test-run
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check matrix results
        run: |
          if [ "${{ needs.test-run.result }}" != "success" ]; then
            echo "::error::Test matrix failed"
            exit 1
          fi

  # CONTRACT: org ruleset requires this exact check name 'lint'
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
      - name: Install dependencies (from uv.lock)
        run: uv sync --locked
      - name: Ruff check + format
        run: |
          uv run ruff check src/ tests/ --output-format=github
          uv run ruff format src/ tests/ --check

  # CONTRACT: org ruleset requires this exact check name 'typecheck'
  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
      - name: Install dependencies (from uv.lock)
        run: uv sync --locked
      - name: Run mypy (fails on any error)
        run: uv run mypy src/cd --ignore-missing-imports

  # CONTRACT: org ruleset requires this exact check name 'security'
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
      - name: Install dependencies (from uv.lock)
        run: uv sync --locked
      - name: Bandit (fails on medium or higher findings)
        run: uv run bandit -r src/ -ll
      - name: pip-audit (audits the locked environment CI installs; fails on known vulnerabilities)
        run: uv run pip-audit

  # CONTRACT: org ruleset requires this exact check name 'quality-gate'
  quality-gate:
    needs: [test, lint, typecheck, security]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Evaluate gate
        run: |
          echo "test:      ${{ needs.test.result }}"
          echo "lint:      ${{ needs.lint.result }}"
          echo "typecheck: ${{ needs.typecheck.result }}"
          echo "security:  ${{ needs.security.result }}"
          for result in \
            "${{ needs.test.result }}" \
            "${{ needs.lint.result }}" \
            "${{ needs.typecheck.result }}" \
            "${{ needs.security.result }}"; do
            if [ "$result" != "success" ]; then
              echo "::error::Required check failed: $result"
              exit 1
            fi
          done
          echo "All gates passed"

  # ── non-required domain checks ─────────────────────────────

  numerical-stability:
    runs-on: ubuntu-latest
    needs: test-run
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
      - name: Install dependencies (from uv.lock)
        run: uv sync --locked
      # Mesh refinement of max Phi at second order, discrete residual at solver tolerance on
      # every grid, manufactured-residual stencil check, and an independent solve_bvp comparison
      # (with and without the gradient term). A run that does not converge fails these tests.
      - name: Grid refinement and independent solves
        run: uv run pytest tests/test_independent_checks.py tests/test_solver_diagnostics.py -v --tb=short

  eigenvalue-precision:
    runs-on: ubuntu-latest
    needs: test-run
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
      - name: Install dependencies (from uv.lock)
        run: uv sync --locked
      # Exact discrete eigenvalue formula (1D, anisotropic 2D, smallest grids), second-order
      # continuum limit, and scale-aware behaviour at lambda_1 = 0.
      - name: Discrete and continuum spectra
        run: uv run pytest tests/test_spectra.py tests/test_eigenvalues.py -v --tb=short

  threshold-verification:
    runs-on: ubuntu-latest
    needs: test-run
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
      - name: Install dependencies (from uv.lock)
        run: uv sync --locked
      # For a = 0 the discrete threshold is exact: every converged solve must land on the branch
      # predicted by the sign of lambda_1, near-threshold runs with a small budget must report
      # 'unresolved' rather than a label, the barrier iteration must be monotone, and the
      # finite-graph crosswalk (verified triangle, converse and bound counterexamples) must hold.
      - name: Branch classification, barriers and graph crosswalk
        run: uv run pytest tests/test_barriers.py tests/test_graph.py tests/test_core.py -v --tb=short

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
      - name: Install dependencies (from uv.lock)
        run: uv sync --locked
      - name: Run tests with coverage
        run: |
          uv run coverage run -m pytest tests/ -v
          uv run coverage report --show-missing
          uv run coverage xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30
