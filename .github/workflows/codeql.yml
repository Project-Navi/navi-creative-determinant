name: CodeQL Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 5 * * 1"  # Monday 05:30 UTC

concurrency:
  group: codeql-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # CONTRACT: this job emits the check named 'codeql' (the GitHub Actions job key
  # below). It is not in the org ruleset's required list today, but the name is
  # what a ruleset would reference, so do NOT rename this job or add a 'name:'
  # override; either would change the emitted check name. The job key was chosen (over 'Analyze (python)' from the analyze
  # step) because the SARIF-upload check that produces 'Analyze (python)' does
  # not fire on Dependabot pull requests — Dependabot's GITHUB_TOKEN is forced
  # read-only on pull_request events, so the upload silently no-ops and the
  # named check is never registered, freezing every Dependabot PR.
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@e46ed2cbd01164d986452f91f178727624ae40d7  # v4.35.3
        with:
          languages: python
          queries: +security-extended
      - name: Autobuild
        uses: github/codeql-action/autobuild@e46ed2cbd01164d986452f91f178727624ae40d7  # v4.35.3
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@e46ed2cbd01164d986452f91f178727624ae40d7  # v4.35.3
        with:
          category: "/language:python"
