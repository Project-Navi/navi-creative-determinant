name: CodeQL Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 5 * * 1"  # Monday 05:30 UTC

concurrency:
  group: codeql-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # CONTRACT: the org 'CI: Python Tier' ruleset requires a check named 'codeql'
  # — i.e. the GitHub Actions job key below. Do NOT rename this job or add a
  # 'name:' override; either would change the emitted check name and break the
  # ruleset. The job key was chosen (over 'Analyze (python)' from the analyze
  # step) because the SARIF-upload check that produces 'Analyze (python)' does
  # not fire on Dependabot pull requests — Dependabot's GITHUB_TOKEN is forced
  # read-only on pull_request events, so the upload silently no-ops and the
  # named check is never registered, freezing every Dependabot PR.
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - name: Initialize CodeQL
        uses: github/codeql-action/init@e46ed2cbd01164d986452f91f178727624ae40d7  # v4.35.3
        with:
          languages: python
          queries: +security-extended
      - name: Autobuild
        uses: github/codeql-action/autobuild@e46ed2cbd01164d986452f91f178727624ae40d7  # v4.35.3
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@e46ed2cbd01164d986452f91f178727624ae40d7  # v4.35.3
        with:
          category: "/language:python"
