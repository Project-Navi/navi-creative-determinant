# Figure Validation CI
#
# Validates that figure generation script works and produces expected outputs.
# Figures are the visual evidence for the framework's claims.

name: Figure Validation

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
    paths:
      - 'figures/**'
      - 'src/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/figures.yml'
  pull_request:
    branches: [main]
    paths:
      - 'figures/**'
      - 'src/**'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:

jobs:
  regenerate-figures:
    name: Regenerate Figures
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies (from uv.lock)
        run: uv sync --locked

      # The generator records the branch and termination of every solve behind every
      # figure and prints ALL_FIGURES_OK only when each one converged; an unresolved point
      # is drawn as a hollow marker with no line through it and fails this job.
      - name: Regenerate figures
        run: |
          echo "═══════════════════════════════════════════════════════════════"
          echo "  FIGURE REGENERATION"
          echo "═══════════════════════════════════════════════════════════════"
          set -o pipefail
          uv run python figures/generate_figures.py | tee figures/generate.log
          grep -q '^ALL_FIGURES_OK$' figures/generate.log || {
            echo "::error::a figure contains an unresolved or invalid solve"
            exit 1
          }

      - name: Verify figure outputs
        run: |
          echo "Verifying generated figures..."

          expected_figures=(
            "fig1_eigenvalue_threshold.png"
            "fig1_eigenvalue_threshold.pdf"
            "fig2_threshold_comparison.png"
            "fig2_threshold_comparison.pdf"
            "fig3_canonical_closure_sweep.png"
            "fig3_canonical_closure_sweep.pdf"
            "fig4_2d_presence_field.png"
            "fig4_2d_presence_field.pdf"
            "fig5_grid_refinement.png"
            "fig5_grid_refinement.pdf"
            "fig6_field_decomposition.png"
            "fig6_field_decomposition.pdf"
            "fig7_2d_phase_transition.png"
            "fig7_2d_phase_transition.pdf"
          )

          missing=0
          for fig in "${expected_figures[@]}"; do
            if [[ -f "figures/$fig" ]]; then
              size=$(stat -f%z "figures/$fig" 2>/dev/null || stat -c%s "figures/$fig")
              echo "  ✓ $fig (${size} bytes)"
            else
              echo "  ✗ $fig (MISSING)"
              missing=$((missing + 1))
            fi
          done

          if [[ $missing -gt 0 ]]; then
            echo ""
            echo "ERROR: $missing figures missing!"
            exit 1
          fi

          echo ""
          echo "✓ All figures generated successfully"

      - name: Upload regenerated figures
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: regenerated-figures
          path: figures/*.png
          retention-days: 7
