name: Semgrep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semgrep-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # CONTRACT: org ruleset requires this exact check name 'semgrep'
  semgrep:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    container:
      image: semgrep/semgrep@sha256:e04d2cb132288d90035db8791d64f610cb255b21e727b94db046243b30c01ae9  # 1.152.0
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - name: Run Semgrep
        run: semgrep scan --config p/python --config p/owasp-top-ten --sarif -o semgrep.sarif .
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@e46ed2cbd01164d986452f91f178727624ae40d7  # v4.35.3
        if: always()
        with:
          sarif_file: semgrep.sarif
