name: Semgrep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: semgrep-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # CONTRACT: org ruleset requires this exact check name 'semgrep'
  semgrep:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    container:
      image: semgrep/semgrep@sha256:e04d2cb132288d90035db8791d64f610cb255b21e727b94db046243b30c01ae9  # 1.152.0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Run Semgrep
        run: semgrep scan --config p/python --config p/owasp-top-ten --sarif -o semgrep.sarif .
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@38697555549f1db7851b81482ff19f1fa5c4fedc  # v4.34.1
        if: always()
        with:
          sarif_file: semgrep.sarif
