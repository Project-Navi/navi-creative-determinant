# Notebook Validation CI
#
# Executes the Jupyter notebook from a fresh kernel and validates it with
# scripts/validate_notebook.py: no error outputs, every code cell executed, at
# least 30 self-asserted numerical checks passed, and the final marker present.
# The notebook is the primary pedagogical artifact—it must work and its claims
# must hold, not merely produce output cells.

name: Notebook Validation

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
    paths:
      - 'notebooks/**'
      - 'src/**'
      - 'scripts/validate_notebook.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/notebooks.yml'
  pull_request:
    branches: [main]
    paths:
      - 'notebooks/**'
      - 'src/**'
      - 'scripts/validate_notebook.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/notebooks.yml'
  workflow_dispatch:

jobs:
  execute-notebooks:
    name: Execute Notebooks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies (from uv.lock)
        run: |
          uv sync --locked
          uv run python -m ipykernel install --user --name python3

      - name: Execute notebook
        run: |
          echo "═══════════════════════════════════════════════════════════════"
          echo "  NOTEBOOK EXECUTION: cd_pde_demo.ipynb"
          echo "═══════════════════════════════════════════════════════════════"
          cd notebooks
          uv run jupyter nbconvert --to notebook --execute \
            --ExecutePreprocessor.timeout=600 \
            --ExecutePreprocessor.kernel_name=python3 \
            --output executed_demo.ipynb \
            cd_pde_demo.ipynb
          echo "✓ Notebook executed successfully"

      # The notebook asserts its own numerical claims (residuals, branch labels, exact discrete
      # eigenvalues, the verified finite-graph example) and prints CHECK PASSED for each one.
      # The validator rejects any error output, any unexecuted code cell, any CHECK FAILED text,
      # fewer than 30 passed checks, or a missing ALL_NOTEBOOK_CHECKS_PASSED marker. Its own
      # negative fixtures are exercised in tests/test_validate_notebook.py.
      - name: Validate executed notebook (fails closed)
        run: uv run python scripts/validate_notebook.py notebooks/executed_demo.ipynb --min-checks 30

      - name: Upload executed notebook
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: executed-notebook
          path: notebooks/executed_demo.ipynb
          retention-days: 7

  notebook-lint:
    name: Notebook Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies (from uv.lock)
        run: uv sync --locked

      - name: Check notebook code quality (fails on findings)
        run: uv run nbqa ruff notebooks/cd_pde_demo.ipynb --ignore E501,E402
