# Code Quality CI
#
# Ensures code quality through linting, type checking, and coverage analysis.
# Mathematical correctness is verified in ci.yml; this checks code health.

name: Code Quality

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/quality.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install "ruff==0.15.4"

      - name: Run ruff
        run: |
          echo "═══════════════════════════════════════════════════════════════"
          echo "  CODE LINTING: Ruff"
          echo "═══════════════════════════════════════════════════════════════"
          ruff check src/ tests/ --output-format=github
          ruff format src/ tests/ --check

  typecheck:
    name: Type Check (MyPy)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install mypy types-setuptools

      - name: Run mypy
        run: |
          echo "═══════════════════════════════════════════════════════════════"
          echo "  TYPE CHECKING: MyPy"
          echo "═══════════════════════════════════════════════════════════════"
          mypy src/cd --ignore-missing-imports --no-error-summary || true
          echo "Type checking complete (errors shown above if any)"

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install "coverage>=7.0.0"

      - name: Run tests with coverage
        run: |
          echo "═══════════════════════════════════════════════════════════════"
          echo "  TEST COVERAGE"
          echo "═══════════════════════════════════════════════════════════════"
          coverage run -m pytest tests/ -v
          coverage report --show-missing
          coverage xml

      - name: Upload coverage report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install bandit
        run: pip install "bandit==1.9.4"

      - name: Run security scan
        run: |
          echo "═══════════════════════════════════════════════════════════════"
          echo "  SECURITY SCAN: Bandit"
          echo "═══════════════════════════════════════════════════════════════"
          bandit -r src/ -ll || true
          echo "Security scan complete"

  docs-build:
    name: Documentation Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Validate markdown files
        run: |
          echo "═══════════════════════════════════════════════════════════════"
          echo "  DOCUMENTATION: Validating markdown files"
          echo "═══════════════════════════════════════════════════════════════"

          # Check all expected docs exist (Diataxis structure)
          docs=(
            "README.md"
            "CONTRIBUTING.md"
            "CODE_OF_CONDUCT.md"
            "LICENSE.md"
            "docs/index.md"
            "docs/getting-started/quickstart.md"
            "docs/explanation/conceptual-primer.md"
            "docs/reference/changelog.md"
          )

          missing=0
          for doc in "${docs[@]}"; do
            if [[ -f "$doc" ]]; then
              echo "  ✓ $doc"
            else
              echo "  ✗ $doc (MISSING)"
              missing=$((missing + 1))
            fi
          done

          if [[ $missing -gt 0 ]]; then
            echo ""
            echo "ERROR: $missing documentation files missing!"
            exit 1
          fi

          echo ""
          echo "✓ All documentation files present"
