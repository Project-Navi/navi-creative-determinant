# Dependabot configuration
# Keeps dependencies updated for security and compatibility. Python dependencies are
# resolved by uv (pyproject.toml + uv.lock), so the uv ecosystem is used; a cooldown
# keeps newly published packages out of automatic updates for a week.

version: 2
updates:
  # Python dependencies (uv.lock)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    groups:
      numpy-scipy:
        patterns:
          - "numpy*"
          - "scipy*"
      dev-dependencies:
        patterns:
          - "pytest*"
          - "ruff*"
          - "mypy*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"
